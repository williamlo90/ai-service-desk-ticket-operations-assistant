name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: python -m pip install -r backend/requirements-postgres.txt
      - run: python -B -m unittest discover -s tests
        working-directory: backend
      - run: npm ci --prefix mcp-server --ignore-scripts
      - run: npm test --prefix mcp-server
      - run: node scripts/check_quote_tools.cjs
      - run: node --test scripts/check_approval_ui.cjs
      - run: python scripts/demo_handover.py
      - name: Audit every committed tree
        run: python scripts/check_public_history.py
      - name: Scan full history with verified Gitleaks binary
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact=100
